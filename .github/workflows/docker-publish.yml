#=================================================
# https://github.com/iflyelf/nightingale-docker
# License: MIT
# Author: iflyelf
# Description: 自动构建 Nightingale 事件聚合版镜像
#=================================================

name: 构建并推送 Nightingale 镜像

# 镜像推送目标（华为云 SWR: 国内可访问, 替代 docker.io）
# 组织名称可直接修改, 凭据通过 Secrets: SWR_USERNAME / SWR_PASSWORD
env:
  SWR_REGISTRY: swr.cn-east-3.myhuaweicloud.com
  SWR_ORGANIZATION: iflyelf
  IMAGE_NAME: nightingale

on:
  push:
    paths:
      - 'Dockerfile'
      - 'apply-aggregation-patch.py'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:
    inputs:
      build_desc:
        description: '构建说明'
        required: false
        default: 'Manual build'
  # 由 submodules-sync.yml 在子模块 tag 更新后触发
  repository_dispatch:
    types: [submodule-updated]
  schedule:
    # 每周一 UTC 02:00 (北京时间 10:00) 自动构建
    - cron: '0 2 * * 1'
  watch:
    types: [started]

# 同一分支仅保留最新一次构建：快速连续提交时自动取消旧构建，
# 避免多个多架构（QEMU）构建并发堆积、互相拖慢导致镜像迟迟不更新。
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: latest
            description: "最新稳定版（事件聚合）"

    steps:
      - name: 🔍 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive  # 自动拉取子模块

      - name: 🔄 读取子模块锁定版本
        run: |
          echo "📦 读取上游 nightingale 子模块锁定的 tag..."
          # 子模块版本由 submodules-sync.yml 对齐到具体 tag, 这里只读取, 不再 --remote 拉取最新
          git submodule update --init upstream

          cd upstream
          LATEST_COMMIT=$(git rev-parse HEAD)
          # 优先取精确匹配的正式版 tag（排除 beta/rc/alpha）
          LATEST_TAG=$(git describe --tags --exact-match 2>/dev/null \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 \
            || echo "unknown")

          echo "📌 上游锁定 commit: $LATEST_COMMIT"
          echo "🏷️  上游锁定 tag: $LATEST_TAG"
          echo "UPSTREAM_COMMIT=$LATEST_COMMIT" >> $GITHUB_ENV
          echo "UPSTREAM_TAG=$LATEST_TAG" >> $GITHUB_ENV

      - name: 🔧 测试补丁脚本
        run: |
          echo "🧪 测试事件聚合补丁..."
          python3 apply-aggregation-patch.py
          
          if grep -q "AggregationKey" upstream/alert/dispatch/dispatch.go; then
            echo "✅ 补丁测试成功"
          else
            echo "❌ 补丁测试失败"
            exit 1
          fi
          
          # 恢复子模块以便 Docker 构建时重新应用
          cd upstream && git checkout alert/dispatch/dispatch.go

      - name: 📝 生成镜像标签
        id: meta
        run: |
          VERSION="${UPSTREAM_TAG#v}"
          if [ "$VERSION" = "unknown" ]; then
            VERSION=$(date +%Y%m%d)
          fi
          
          TAGS=""
          TAGS="$TAGS,${{ secrets.DOCKER_USERNAME }}/nightingale:${{ matrix.tag }}"
          TAGS="$TAGS,${{ secrets.DOCKER_USERNAME }}/nightingale:${VERSION}-aggregation"
          TAGS="$TAGS,${{ secrets.DOCKER_USERNAME }}/nightingale:latest-aggregation"
          # 华为云 SWR 同标签推送
          TAGS="$TAGS,${{ env.SWR_REGISTRY }}/${{ env.SWR_ORGANIZATION }}/nightingale:${{ matrix.tag }}"
          TAGS="$TAGS,${{ env.SWR_REGISTRY }}/${{ env.SWR_ORGANIZATION }}/nightingale:${VERSION}-aggregation"
          TAGS="$TAGS,${{ env.SWR_REGISTRY }}/${{ env.SWR_ORGANIZATION }}/nightingale:latest-aggregation"
          
          echo "tags=${TAGS#,}" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 🛠️ 安装 QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: 🛠️ 安装 Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: 🔐 登录 DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🔐 登录华为云 SWR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.SWR_REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: 🚀 构建并推送镜像
        uses: docker/build-push-action@v6
        # 华为云 SWR 不支持 OCI media types 与证明清单(attestation)，
        # 否则报 "Invalid image, fail to parse 'manifest.json'"。
        # 关闭 provenance/sbom 并输出 Docker 媒体类型以兼容 SWR。
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          outputs: type=image,oci-mediatypes=false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            UPSTREAM_TAG=${{ env.UPSTREAM_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Nightingale (Event Aggregation)
            org.opencontainers.image.description=Nightingale 监控系统 - 事件聚合版
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.upstream=${{ env.UPSTREAM_COMMIT }}

      # 华为云 SWR 镜像仓库默认私有，push 后调用 SWR API 设为公开
      # 需 Secrets: SWR_AK / SWR_SK（华为云账号 AK/SK，具备 swr:repo:updateRepo 权限）
      - name: 🔓 设置 SWR 镜像为公开
        env:
          CLOUD_SDK_AK: ${{ secrets.SWR_AK }}
          CLOUD_SDK_SK: ${{ secrets.SWR_SK }}
          SWR_REGION: cn-east-3
          SWR_ORGANIZATION: ${{ env.SWR_ORGANIZATION }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          if [ -z "$CLOUD_SDK_AK" ] || [ -z "$CLOUD_SDK_SK" ]; then
            echo "未配置 SWR_AK / SWR_SK，跳过设置公开"
            exit 0
          fi
          pip install --quiet huaweicloudsdkcore huaweicloudsdkswr
          python - <<'PY'
          import os
          from huaweicloudsdkcore.auth.credentials import BasicCredentials
          from huaweicloudsdkswr.v2.region.swr_region import SwrRegion
          from huaweicloudsdkswr.v2 import SwrClient
          from huaweicloudsdkswr.v2.model import UpdateRepoRequest, UpdateRepoRequestBody

          client = SwrClient.new_builder() \
              .with_credentials(BasicCredentials(os.environ["CLOUD_SDK_AK"], os.environ["CLOUD_SDK_SK"])) \
              .with_region(SwrRegion.value_of(os.environ["SWR_REGION"])) \
              .build()

          namespace = os.environ["SWR_ORGANIZATION"]
          for repository in [os.environ["IMAGE_NAME"]]:
              req = UpdateRepoRequest()
              req.namespace = namespace
              req.repository = repository
              req.body = UpdateRepoRequestBody(is_public=True)
              client.update_repo(req)
              print(f"✅ 已设为公开: {namespace}/{repository}")
          PY

      - name: 📊 生成构建报告
        if: always()
        run: |
          echo "## 🐳 镜像构建报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 信息 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 上游版本 | ${{ env.UPSTREAM_TAG }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 上游 Commit | ${{ env.UPSTREAM_COMMIT }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 镜像标签 | \`${{ steps.meta.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 平台 | linux/amd64, linux/arm64 |" >> $GITHUB_STEP_SUMMARY
          echo "| 功能特性 | ✅ 事件聚合（60秒窗口） |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 使用方式" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ secrets.DOCKER_USERNAME }}/nightingale:latest-aggregation" >> $GITHUB_STEP_SUMMARY
          echo "docker run -d --name n9e \\" >> $GITHUB_STEP_SUMMARY
          echo "  -p 17000:17000 -p 18000:18000 \\" >> $GITHUB_STEP_SUMMARY
          echo "  ${{ secrets.DOCKER_USERNAME }}/nightingale:latest-aggregation" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  cleanup:
    name: 清理旧 workflow
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      actions: write
      contents: read
    steps:
      - name: 删除旧的 workflow 运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 3
