apiVersion: v1
kind: Secret
metadata:
  name: n9e-scripts-secret
  namespace: n9e
  labels:
    app.kubernetes.io/name: nightingale
    app.kubernetes.io/component: notify-scripts
type: Opaque
stringData:
  # ======================================================================
  # 邮件通知配置（send_nightingale_email.py）
  # ======================================================================
  EMAIL_HOST: "mail.iflymail.com.cn"
  EMAIL_PORT: "465"
  EMAIL_USER: "qxb_super@iflymail.com.cn"
  EMAIL_FROM: "qxb_super@iflymail.com.cn"
  MAIL_PASS: "vpcJXDStkeMvrz4U"
  
  # ======================================================================
  # Grafana 图表渲染配置（send_nightingale_im.py / send_nightingale_im_urgent.py / send_nightingale_email.py）
  # ======================================================================
  GRAFANA_BASE_URL: "http://ifly.iflytek.com/grafana"
  GRAFANA_DASHBOARD_UID: "adl6lsk"
  GRAFANA_DATASOURCE_UID: "cefdos8p4hc74c"
  
  # ======================================================================
  # 飞书域名配置（所有飞书脚本通用）
  # ======================================================================
  FEISHU_DOMAIN: "open.xfchat.iflytek.com"
  
  # ======================================================================
  # N9E 平台配置（所有脚本通用）
  # ======================================================================
  DEFAULT_DOMAIN_URL: "http://n9e-center.iflytek.com"
  
  # ======================================================================
  # 回调服务地址（告警屏蔽、AI 分析、协同群功能）
  # ======================================================================
  CALLBACK_SERVER_URL: "http://n9e-gateway.n9e.svc.cluster.local:5000"
  
  # ======================================================================
  # 脚本超时配置（秒）—— 用于避免因外部服务慢导致脚本被 n9e kill
  # 注意：这些是脚本内部各阶段超时，n9e Script 媒介的总超时需在 Web 界面配置
  # ======================================================================
  # Grafana 图片渲染超时（email / im / im_urgent）
  GRAFANA_RENDER_TIMEOUT: "15"
  
  # Grafana API 超时（仪表盘增删改查，im / im_urgent / email）
  GRAFANA_API_TIMEOUT: "8"
  
  # 飞书 API 超时（token/发消息/加急，im / im_urgent / feishu）
  FEISHU_API_TIMEOUT: "6"
  
  # 飞书群机器人 webhook 推送超时（feishu）
  FEISHU_WEBHOOK_TIMEOUT: "8"
  
  # 回调服务注册超时（屏蔽/AI分析/协同群，im / im_urgent / feishu）
  CALLBACK_API_TIMEOUT: "6"
  
  # SMTP 邮件发送超时（email）
  SMTP_TIMEOUT: "10"
  
  # 短信网关请求超时（sms）
  SMS_API_TIMEOUT: "10"
