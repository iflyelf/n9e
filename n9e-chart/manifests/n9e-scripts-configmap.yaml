                    else:
                        inner = f'instance="{instance}"'
                return '{' + inner + '}'
    
            # 匹配 {label=value,...} 这样的标签选择器，并替换所有匹配的
            expr = re.sub(r'\{([^}]*)\}', add_instance, expr)
            logger.debug("添加 instance 后: %s", expr)
    
        logger.info("最终 PromQL: %s", expr)
        return expr
    
