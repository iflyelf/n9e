    logging.getLogger("urllib3").setLevel(logging.WARNING)  # 关闭 urllib3 DEBUG 噪音
    
    # 默认告警详情地址
    DEFAULT_DOMAIN_URL = os.getenv("DEFAULT_DOMAIN_URL", "http://n9e-center.iflytek.com")
    
