{{/*
  Secret：存放渲染后的 Nightingale 配置文件
  由于配置文件中包含数据库 DSN 密码和 Redis 密码等敏感信息，
  且 n9e 的 multiconfig 加载器中 TOML 文件会覆盖环境变量，
  因此将完整配置文件渲染进 Secret 并以文件方式挂载，最为可靠且安全。
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "n9e.secretName" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.podLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: nightingale
  {{- if .Values.podAnnotations }}
  annotations: {{- toYaml .Values.podAnnotations | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- if eq .Values.mode "edge" }}
  # 边缘告警引擎 (n9e-edge) 配置文件
  edge.toml: |-
    {{- if .Values.edgeConfigOverride }}
    {{- .Values.edgeConfigOverride | nindent 4 }}
    {{- else }}
    {{- include "n9e.edgeConfig" . | nindent 4 }}
    {{- end }}
  {{- else }}
  # 中心端 (n9e) 配置文件
  config.toml: |-
    {{- if .Values.configOverride }}
    {{- .Values.configOverride | nindent 4 }}
    {{- else }}
    {{- include "n9e.centerConfig" . | nindent 4 }}
    {{- end }}
  {{- end }}
